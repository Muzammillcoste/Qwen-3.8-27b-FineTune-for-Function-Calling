[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tooldistill"
version = "0.0.1"
description = "ToolDistill-Lab: data-selection study for small-LM tool-calling SFT (research code)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Code license not yet chosen by researcher. Data: see LICENSE_NOTICES.md" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24", "datasets>=2.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tooldistill = "tooldistill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
