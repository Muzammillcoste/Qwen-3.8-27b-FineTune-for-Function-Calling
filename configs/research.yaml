# Research protocol parameters. Phase 0: definitions only; nothing here has been run.
study:
  title: >-
    Quality and Diversity Versus Quantity in Small Language Model Tool-Calling Adaptation:
    A Controlled Data-Selection Study
  status: design_only
  primary_seed: 42

research_questions:
  RQ1: Selection policy vs uniform sampling at equal N (1k).
  RQ2: Diversity coverage beyond the quality heuristic at equal N.
  RQ3: Carefully selected 1k vs random 3k from the same eligible pool (fixed-epoch).
  RQ4: Persistence after token/step/runtime budget accounting.
  RQ5: Whether independent human quality annotations predict gains.
  RQ6: Generalization to internal held-out xLAM split and selected BFCL single-turn categories.

quality_proxy:
  score_version: null          # defined in Phase 2, frozen before any training
  components:
    - tool_identity_integrity
    - argument_schema_validity
    - grounding_signal         # noisy heuristic only
    - consistency
  recorded_separately:
    - difficulty_complexity     # never treated as low quality automatically
    - novelty_dedup

feasibility_gate:
  histogram_bins: 20
  min_human_reviewed: 100
  per_candidate_subset: 50
  blind_to_subset: true
  # Decision rule is a human decision; Codex must not auto-pass the gate.
  auto_pass: false

source_matching:
  max_teacher_ratio_deviation: 0.02   # absolute, between arms; violations stop selection

# ----------------------------------------------------------------------------------------------
# Phase 2 (approved 2026-10-18): Option A framing — data selection, diversity, coverage, quantity.
# Option B (controlled label noise) is DEFERRED; not implemented.
primary_pool:
  splits: [train]                 # selection never sees val/test (enforced in select.build_pool)
  call_structure: single_call     # multi-call records preserved, unused in the primary experiment
  exclude: [exact_duplicate]
  max_rendered_tokens: 1536      # proposed pilot max_seq_length; longer records would lose their target

arms: [random_1k, schema_consistent_1k, diversity_1k, random_3k]
stratify_by: [teacher_source, tools_bucket, args_bucket, rendered_length_tertile]

schema_arm_gate:
  # Keep schema_consistent_1k only if it differs from random_1k in >= this % of its examples.
  # NOTE: set after Phase 1 had already shown ~2-3% schema-inconsistent records corpus-wide, so it
  # is not a blind pre-registration. Raw counts are always reported alongside the verdict.
  min_difference_pct: 5.0

semantic_audit:
  per_arm: 40                      # per 1k arm, proportional to teacher within the arm
  diagnostic: {schema_conflict: 20, ambiguous: 10}   # blinded pool records outside the 1k arms

compute:
  per_device_batch: 1
  grad_accum: 8
  # ASSUMPTIONS ONLY (not measured). Replaced by the Phase 3 pilot measurement.
  assumed_train_tokens_per_s: [150, 300, 600]
  assumed_generate_tokens_per_s_batch1: [8, 15, 25]
