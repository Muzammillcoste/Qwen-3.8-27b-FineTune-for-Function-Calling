# ToolDistill-Lab data configuration.
# All relative paths resolve against the repository root (no personal absolute paths).

source:
  repo_id: Salesforce/xlam-function-calling-60k
  # Observed (metadata only, unauthenticated) on 2026-10-18: 26d14ebfe18b1f7b524bd39b404b50af5dc97866
  # Pin is confirmed in Phase 1 after authenticated download; loader fails if revision changes.
  revision: 26d14ebfe18b1f7b524bd39b404b50af5dc97866
  # Card config "dataset" maps split "train" -> xlam_function_calling_60k.json. Verify on download.
  config_name: null
  split: train
  data_file: xlam_function_calling_60k.json
  card_url: https://huggingface.co/datasets/Salesforce/xlam-function-calling-60k
  license: CC-BY-4.0
  gated: true

paths:
  raw_dir: data/raw
  normalized_dir: data/normalized
  splits_dir: data/splits
  selected_dir: data/selected
  audits_dir: data/audits
  kaggle_upload_dir: data/kaggle_upload
  inspection_report: reports/dataset_inspection.md

ids:
  # Name of the source field holding the original sample ID.
  # UNVERIFIED: the dataset card text refers to ids 0..33658, but the card's example object shows
  # no "id" key. Phase 1 inspection must confirm the real field before provenance is trusted.
  id_field: id
  # If the id field is absent, the ORIGINAL (unshuffled) file row index may be used as the ID only
  # when this is explicitly set to true after human review. Default false: missing IDs => teacher
  # source "unknown" and a validation flag. Never derived from a shuffled DataFrame index.
  allow_source_row_index_as_id: false

provenance:
  # From the dataset card: "The first 33,659 data entries were generated by DeepSeek,
  # i.e., from id 0 to id 33658"; remaining entries by Mixtral-8x22B-Instruct.
  rules:
    - {teacher_source: deepseek-v2-chat, min_id: 0, max_id: 33658}
    - {teacher_source: mixtral-8x22b-instruct, min_id: 33659, max_id: 59999}
  expected_counts_full_dataset:
    deepseek-v2-chat: 33659
    mixtral-8x22b-instruct: 26341
  card_claim_verified: false   # set true only after Phase 1 full-data check passes

normalization:
  schema_version: tooldistill.normalized.v1
  # Requiredness is THREE-STATE (approved 2026-10-18), declared vs inferred tracked separately:
  #   REQUIRED: declared required (required: true / required-list membership), no contrary evidence
  #   OPTIONAL: declared required: false, OR ", optional" suffix / Optional[X], OR default present
  #   UNKNOWN : no evidence, or contradictory metadata (flagged requiredness_conflict)
  # Only REQUIRED params enter the JSON-Schema "required" list. A missing UNKNOWN argument is a
  # WARNING (missing_arg_unknown_requiredness), never an invalid-label verdict.
  # additionalProperties=false on converted object schemas: spurious answer args are flagged.
  additional_properties: false
  strict_unknown_types: true   # unknown types are flagged, never cast to string

tokenizer:
  # Token-length audit only: downloads tokenizer.json (~11 MB). NEVER model weights.
  repo_id: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  filename: tokenizer.json

dedup:
  algorithm_version: dedup-v1
  near_duplicate_jaccard: 0.8       # token-set Jaccard on normalized query, within same call-name block
  group_same_query_text: true       # identical normalized query => same group regardless of labels
  max_block_pairwise: 5000          # blocks above this size are logged; pairwise is still exhaustive

split:
  algorithm_version: split-v1
  seed: 42
  ratios: {train: 0.8, val: 0.1, test: 0.1}
  stratify_by: [teacher_source, call_count_bucket]
  min_records_per_split: 1
